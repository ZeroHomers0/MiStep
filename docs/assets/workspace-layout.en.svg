<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="640" viewBox="0 0 1040 640" role="img" aria-labelledby="title desc">
  <title id="title">OneStepLite workspace and three gestures</title>
  <desc id="desc">A clock, the One Step header and a frequent-app rail above one main area and three side tasks. Open an app, collect it into an empty slot, tap to swap, or swipe outward to return it to the background.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff8f2" /><stop offset="1" stop-color="#f8faf9" />
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#245c48" /><stop offset="1" stop-color="#183e33" />
    </linearGradient>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto-start-reverse"><path d="M0 0L6 3.5L0 7" fill="none" stroke="#369368" stroke-width="1.5" /></marker>
  </defs>
  <rect x="1" y="1" width="1038" height="638" rx="28" fill="url(#page)" stroke="#d9e7df" />
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif">
    <rect x="42" y="29" width="442" height="580" rx="32" fill="#dce8e1" />
    <rect x="48" y="23" width="430" height="580" rx="30" fill="#fff" stroke="#b8cbc0" stroke-width="2" />

    <!-- Clock -->
    <text x="72" y="76" fill="#1d3a2c" font-size="30" font-weight="650">09:41</text>
    <text x="72" y="98" fill="#7b8f83" font-size="13">Wednesday, October 29</text>

    <!-- Header: One Step + four fixed buttons -->
    <rect x="62" y="112" width="402" height="46" rx="14" fill="url(#green)" />
    <g stroke="#dff0e6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="78" y="126" width="18" height="18" rx="4" />
      <path d="M87 126v18" />
      <rect x="118" y="126" width="18" height="18" rx="4" />
      <path d="M127 126v18" />
      <circle cx="404" cy="135" r="8" />
      <path d="M404 131v4l3 2" />
      <path d="M432 128h14M432 135h14M432 142h14" />
    </g>
    <text x="263" y="141" text-anchor="middle" fill="#fff" font-size="18" font-weight="600">One Step</text>

    <!-- Frequent-app rail -->
    <rect x="62" y="166" width="402" height="40" rx="12" fill="#eef3ef" />
    <g fill="#c3d6c9">
      <rect x="76" y="176" width="20" height="20" rx="6" />
      <rect x="106" y="176" width="20" height="20" rx="6" />
      <rect x="136" y="176" width="20" height="20" rx="6" />
      <rect x="166" y="176" width="20" height="20" rx="6" />
      <rect x="196" y="176" width="20" height="20" rx="6" />
    </g>
    <text x="440" y="191" text-anchor="end" fill="#6b8072" font-size="13">Frequent apps · long-press to customize</text>

    <!-- Main area -->
    <rect x="62" y="218" width="284" height="368" rx="16" fill="#f9fbfa" stroke="#c8d9ce" />
    <rect x="78" y="235" width="252" height="8" rx="4" fill="#dce7e0" />
    <rect x="78" y="254" width="172" height="7" rx="3.5" fill="#e6ede8" />
    <text x="204" y="392" text-anchor="middle" fill="#244e38" font-size="30" font-weight="650">Main area</text>
    <text x="204" y="424" text-anchor="middle" fill="#6b8072" font-size="15">Tap · Scroll · Type</text>
    <rect x="91" y="500" width="226" height="72" rx="10" fill="#e7eee9" />
    <g fill="#f9fbfa">
      <rect x="103" y="512" width="202" height="10" rx="3" />
      <rect x="112" y="530" width="184" height="10" rx="3" />
      <rect x="153" y="548" width="102" height="10" rx="3" />
    </g>

    <!-- Three side slots -->
    <rect x="358" y="218" width="106" height="116" rx="14" fill="#dcefe2" />
    <text x="411" y="270" text-anchor="middle" fill="#24523a" font-size="14" font-weight="600">Side task 1</text>
    <text x="411" y="297" text-anchor="middle" fill="#5b7b66" font-size="13">Tap to swap</text>
    <rect x="358" y="344" width="106" height="116" rx="14" fill="#e4eee7" />
    <text x="411" y="396" text-anchor="middle" fill="#24523a" font-size="14" font-weight="600">Side task 2</text>
    <text x="411" y="423" text-anchor="middle" fill="#5b7b66" font-size="13">Swipe out</text>
    <rect x="358" y="470" width="106" height="116" rx="14" fill="#f0f5f1" stroke="#b8d0bf" stroke-dasharray="5 5" />
    <path d="M399 513H423M411 501V525" stroke="#75a587" stroke-width="2.5" stroke-linecap="round" />
    <text x="411" y="552" text-anchor="middle" fill="#5b7b66" font-size="14">Collect app</text>
    <path d="M333 313H370" fill="none" stroke="#369368" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)" />

    <!-- Explanation -->
    <text x="539" y="94" fill="#214d36" font-size="30" font-weight="700">Keep your apps in view</text>
    <text x="540" y="126" fill="#708577" font-size="16">One main area. Three side tasks. Tap to swap.</text>
    <g>
      <circle cx="558" cy="199" r="19" fill="#d6eadc" />
      <text x="558" y="205" text-anchor="middle" fill="#2a6544" font-size="18" font-weight="700">1</text>
      <text x="595" y="198" fill="#254b35" font-size="21" font-weight="650">Open, then collect</text>
      <text x="595" y="228" fill="#697e70" font-size="16">Open an app → tap an empty slot’s ＋</text>
    </g>
    <g>
      <circle cx="558" cy="307" r="19" fill="#d6eadc" />
      <text x="558" y="313" text-anchor="middle" fill="#2a6544" font-size="18" font-weight="700">2</text>
      <text x="595" y="306" fill="#254b35" font-size="21" font-weight="650">Tap the task you need</text>
      <text x="595" y="336" fill="#697e70" font-size="16">Tap a side task to swap with the main area</text>
    </g>
    <g>
      <circle cx="558" cy="415" r="19" fill="#d6eadc" />
      <text x="558" y="421" text-anchor="middle" fill="#2a6544" font-size="18" font-weight="700">3</text>
      <text x="595" y="414" fill="#254b35" font-size="21" font-weight="650">Swipe outward to make room</text>
      <text x="595" y="444" fill="#697e70" font-size="16">Return the task to the background; reuse the slot</text>
    </g>
    <path d="M540 492H970" stroke="#d1e0d5" />
    <text x="540" y="531" fill="#688371" font-size="15">Use the main area for full interaction</text>
    <text x="540" y="556" fill="#8a9e90" font-size="14">Layout diagram · Side tasks can sit on either side</text>
  </g>
</svg>
