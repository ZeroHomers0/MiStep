# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true

# This project is pure Java. AGP 9 ships built-in Kotlin support and would
# otherwise add the Kotlin standard library to the APK.
android.builtInKotlin=false
kotlin.stdlib.default.dependency=false

# Keep the packaged resource names and file paths stable so the release APK
# matches the layout produced by the previous aapt2 pipeline.
android.enableResourceOptimizations=false
